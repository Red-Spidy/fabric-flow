<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FabricFlow — Supply Chain Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f8fafc;--surface:#ffffff;--card:#ffffff;--card2:#f1f5f9;
  --border:#e2e8f0;--border2:#cbd5e1;
  --blue:#3b82f6;--indigo:#6366f1;--violet:#8b5cf6;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --radius:14px;--sh:0 4px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── LOGIN ── */
#loginPage {
  display:flex;
  min-height:100vh;
}
.lpB{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3rem;
  background: url('fabric_bg.png') center/cover no-repeat;position:relative;overflow:hidden;}
.lpB::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.85),rgba(248,250,252,0.95));backdrop-filter:blur(8px);z-index:0;}
.brandLogo{width:85px;height:85px;background:linear-gradient(135deg,#0ea5e9,#3b82f6);border-radius:24px;
  display:flex;align-items:center;justify-content:center;font-size:2.8rem;margin-bottom:1.5rem;
  box-shadow:0 15px 35px rgba(59,130,246,.25);z-index:1;}
.brandName{font-size:3rem;font-weight:900;background:linear-gradient(135deg,#0f172a,#334155);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;z-index:1;letter-spacing:-1px;}
.brandTag{color:#475569;font-size:1.05rem;font-weight:500;margin-top:.5rem;z-index:1;text-align:center;}
.brandFeats{display:none;}
.bf{display:none;}
.lpF{width:460px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:center;padding:3.5rem;}
.lpT{font-size:1.8rem;font-weight:800;margin-bottom:.4rem;color:var(--text);letter-spacing:-0.5px;}
.lpS{color:var(--text2);font-size:.9rem;margin-bottom:2.5rem;}
.fg{margin-bottom:1.2rem;}
.fg label{font-size:.75rem;font-weight:700;color:var(--text2);display:block;margin-bottom:.4rem;letter-spacing:.05em;text-transform:uppercase;}
.fg input{width:100%;background:var(--surface);border:1.5px solid var(--border2);color:var(--text);
  border-radius:10px;padding:.8rem 1rem;font-size:.95rem;font-family:'Inter',sans-serif;transition:.2s;}
.fg input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.15);background:var(--surface);}
.btnLogin{width:100%;padding:.9rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;margin-top:.5rem;transition:.2s;}
.btnLogin:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.4);}
.lpErr{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;
  border-radius:8px;padding:.7rem 1rem;font-size:.82rem;margin-top:.75rem;display:none;}
.dcWrap{margin-top:2rem;padding:1rem;background:rgba(59,130,246,.06);
  border:1px solid rgba(59,130,246,.15);border-radius:10px;}
.dcWrap .lbl{font-size:.67rem;color:var(--text3);margin-bottom:.5rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.dcItem{font-size:.75rem;color:var(--text2);padding:.2rem 0;display:flex;align-items:center;gap:.5rem;}
.dcItem code{color:var(--blue);background:rgba(59,130,246,.1);padding:1px 6px;border-radius:4px;font-size:.8rem;}
@media(max-width:768px){#loginPage{flex-direction:column;}.lpB{display:none;}.lpF{width:100%;padding:2rem;}}

/* ── APP SHELL ── */
#appShell{display:none;height:100vh;overflow:hidden;}
.layout{display:flex;height:100vh;}

/* ── SIDEBAR ── */
.sb{width:256px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;}
.sbHead{padding:1.2rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.7rem;}
.sbLogo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.sbTitle{font-size:.9rem;font-weight:800;}
.sbSub{font-size:.6rem;color:var(--text2);}
.sbUser{padding:.9rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.7rem;}
.ua{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;}
.ua-admin{background:rgba(245,158,11,.2);color:#fbbf24;}
.ua-manufacturer{background:rgba(59,130,246,.2);color:#60a5fa;}
.ua-buyer{background:rgba(16,185,129,.2);color:#34d399;}
.uName{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uRole{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.uRole.admin{color:#fbbf24;}.uRole.manufacturer{color:#60a5fa;}.uRole.buyer{color:#34d399;}
.sbNav{flex:1;overflow-y:auto;padding:.5rem 0;}
.navSec{padding:.5rem 1.4rem .2rem;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.ni{display:flex;align-items:center;gap:.7rem;padding:.58rem 1rem;cursor:pointer;
  transition:.15s;font-size:.81rem;font-weight:500;color:var(--text2);
  margin:1px .5rem;border-radius:8px;position:relative;}
.ni:hover{background:rgba(0,0,0,.04);color:var(--text);}
.ni.active{background:rgba(59,130,246,.12);color:var(--blue);}
.ni.active::before{content:'';position:absolute;left:0;height:60%;width:3px;background:var(--blue);border-radius:0 2px 2px 0;}
.niIco{font-size:.92rem;width:18px;text-align:center;flex-shrink:0;}
.niBadge{margin-left:auto;background:var(--amber);color:#000;font-size:.57rem;font-weight:800;padding:2px 6px;border-radius:20px;}
.niBadge.blue{background:var(--blue);color:#fff;}
.sbFoot{padding:1rem 1.4rem;border-top:1px solid var(--border);}
.btnLogout{width:100%;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  color:#f87171;border-radius:8px;padding:.5rem;font-size:.78rem;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:.2s;}
.btnLogout:hover{background:rgba(239,68,68,.2);}

/* ── MAIN ── */
.mc{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;}
.pH{padding:1.1rem 1.75rem;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
.pHl{}
.pHbc{font-size:.68rem;color:var(--text3);margin-bottom:.18rem;}
.pHt{font-size:1.25rem;font-weight:800;}
.pHr{display:flex;gap:.6rem;align-items:center;}
.cb{padding:1.5rem 1.75rem;flex:1;}

/* ── NOTIFICATION BELL ── */
.bellBtn{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.03);
  border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;transition:.2s;}
.bellBtn:hover{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);}
.bellCount{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;
  font-size:.58rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid var(--surface);animation:bellPop .3s ease;}
@keyframes bellPop{from{transform:scale(0);}to{transform:scale(1);}}

/* ── NOTIFICATION PANEL ── */
.notifMask{position:fixed;inset:0;z-index:200;display:none;}
.notifMask.open{display:block;}
.notifPanel{position:fixed;top:0;right:0;width:380px;height:100vh;
  background:var(--surface);border-left:1px solid var(--border);z-index:201;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;
  box-shadow:-8px 0 40px rgba(0,0,0,.08);}
.notifMask.open .notifPanel{transform:translateX(0);}
.nPHead{padding:1.2rem 1.4rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;}
.nPTitle{font-size:.95rem;font-weight:700;}
.nPClose{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.1rem;}
.nPClose:hover{color:var(--text);}
.nPActions{padding:.65rem 1.4rem;border-bottom:1px solid var(--border);display:flex;gap:.5rem;}
.nPFeed{flex:1;overflow-y:auto;padding:.6rem;}
.notifItem{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.85rem 1rem;margin-bottom:.5rem;cursor:pointer;transition:.2s;position:relative;}
.notifItem:hover{border-color:var(--border2);}
.notifItem.unread{border-left:3px solid var(--blue);}
.notifItem.unread.order{border-left-color:var(--green);}
.notifItem.unread.stage{border-left-color:var(--violet);}
.notifItem.unread.aws{border-left-color:var(--amber);}
.nIco{font-size:1.1rem;margin-right:.5rem;}
.nMsg{font-size:.8rem;font-weight:500;line-height:1.4;}
.nTime{font-size:.68rem;color:var(--text3);margin-top:.3rem;}
.nUnreadDot{width:7px;height:7px;border-radius:50%;background:var(--blue);
  position:absolute;top:.9rem;right:.9rem;}

/* ── COMPONENTS ── */
.kpig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.5rem;}
.kc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.2rem 1.3rem;position:relative;overflow:hidden;transition:.2s;}
.kc:hover{transform:translateY(-2px);box-shadow:var(--sh);}
.kcBar{height:3px;position:absolute;top:0;left:0;right:0;}
.kcIco{font-size:1.45rem;margin-bottom:.45rem;}
.kcVal{font-size:1.85rem;font-weight:900;line-height:1;}
.kcLbl{font-size:.68rem;color:var(--text2);margin-top:.22rem;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.1rem;}
.ph{padding:.85rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pt{font-size:.83rem;font-weight:700;}
.pb{padding:1.05rem;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;}
th{padding:.52rem .85rem;text-align:left;font-size:.61rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);}
td{padding:.68rem .85rem;font-size:.79rem;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(59,130,246,.03);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:.65rem;font-weight:600;}
.b-blue{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.2);}
.b-green{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.2);}
.b-amber{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.2);}
.b-red{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.b-violet{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.2);}
.b-cyan{background:rgba(6,182,212,.15);color:#22d3ee;border:1px solid rgba(6,182,212,.2);}
.b-gray{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.2);}
.btn{padding:.48rem .95rem;border-radius:8px;border:none;font-size:.79rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.18s;display:inline-flex;align-items:center;gap:.35rem;}
.btn-p{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;}
.btn-p:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,130,246,.35);}
.btn-s{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2);}
.btn-s:hover{background:rgba(59,130,246,.2);}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-g:hover{border-color:var(--blue);color:var(--blue);}
.btn-d{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.btn-d:hover{background:rgba(239,68,68,.2);}
.btn-warn{background:rgba(245,158,11,.1);color:#fbbf24;border:1px solid rgba(245,158,11,.2);}
.btn-sm{padding:.28rem .7rem;font-size:.72rem;}
.btn-xs{padding:.18rem .55rem;font-size:.65rem;}
.field{margin-bottom:.85rem;}
.field label{font-size:.69rem;font-weight:700;color:var(--text2);display:block;margin-bottom:.3rem;letter-spacing:.05em;text-transform:uppercase;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:.55rem .8rem;font-size:.81rem;font-family:'Inter',sans-serif;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
.field textarea{resize:vertical;min-height:70px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
/* Modal */
.mm{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);z-index:300;display:none;align-items:center;justify-content:center;}
.mm.open{display:flex;}
.mbox{background:var(--card);border:1px solid var(--border2);border-radius:20px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:mIn .22s ease;}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.mh{padding:1.35rem 1.55rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mt{font-size:.97rem;font-weight:700;}
.mx{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.1rem;}
.mx:hover{color:var(--text);}
.mb{padding:1.35rem 1.55rem;}
.mf{padding:.85rem 1.55rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.65rem;}
/* Toast */
.ts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:500;display:flex;flex-direction:column;gap:.45rem;}
.ti{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:.75rem 1rem;
  font-size:.79rem;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:flex;align-items:center;gap:.6rem;min-width:250px;
  transform:translateX(110%);transition:transform .3s ease;}
.ti.in{transform:translateX(0);}
.ti.success{border-left:3px solid var(--green);}
.ti.error{border-left:3px solid var(--red);}
.ti.info{border-left:3px solid var(--blue);}
.ti.warn{border-left:3px solid var(--amber);}
/* Pipeline */
.pipe{display:flex;align-items:flex-start;padding:1.1rem;overflow-x:auto;}
.ps{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:.4rem;position:relative;}
.ps:not(:last-child)::after{content:'';position:absolute;top:21px;left:calc(50% + 23px);right:calc(-50% + 23px);height:2px;background:var(--border2);}
.ps.done:not(:last-child)::after{background:var(--green);}
.ps.active:not(:last-child)::after{background:linear-gradient(90deg,var(--blue),var(--border2));}
.sc{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:2px solid var(--border2);background:var(--surface);z-index:1;transition:.3s;}
.ps.done .sc{border-color:var(--green);background:rgba(16,185,129,.15);box-shadow:0 0 10px rgba(16,185,129,.25);}
.ps.active .sc{border-color:var(--blue);background:rgba(59,130,246,.15);box-shadow:0 0 16px rgba(59,130,246,.4);animation:pPulse 2s infinite;}
@keyframes pPulse{0%,100%{box-shadow:0 0 16px rgba(59,130,246,.4);}50%{box-shadow:0 0 24px rgba(59,130,246,.7);}}
.sl{font-size:.65rem;font-weight:600;color:var(--text3);text-align:center;}
.ps.done .sl{color:var(--green);}
.ps.active .sl{color:var(--blue);}
/* AWS status chips */
.awsRow{display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.awsChip{display:flex;align-items:center;gap:.5rem;padding:.5rem .85rem;
  background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:.74rem;}
.awsDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.awsDot.ok{background:var(--green);box-shadow:0 0 6px var(--green);animation:dotPulse 2s infinite;}
.awsDot.warn{background:var(--amber);}
.awsDot.err{background:var(--red);}
@keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.awsLabel{font-weight:600;}
.awsSub{color:var(--text3);font-size:.67rem;}
/* Instance/bucket card */
.resCard{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.resInfo{}
.resName{font-size:.82rem;font-weight:700;}
.resMeta{font-size:.7rem;color:var(--text3);margin-top:.2rem;}
/* Setup wizard */
.wizStep{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:.8rem;}
.wizN{display:inline-flex;width:24px;height:24px;border-radius:50%;background:rgba(59,130,246,.2);border:2px solid var(--blue);color:var(--blue);font-size:.7rem;font-weight:700;align-items:center;justify-content:center;margin-right:.5rem;}
.wizTitle{font-size:.82rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;}
/* Empty */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);}
.emptyIco{font-size:2.2rem;margin-bottom:.6rem;}
.emptyTxt{font-size:.82rem;}
/* Info box */
.infoBox{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.18);border-radius:10px;padding:.75rem 1rem;font-size:.79rem;color:var(--text2);margin-bottom:.9rem;}
.warnBox{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.18);border-radius:10px;padding:.75rem 1rem;font-size:.79rem;color:#fbbf24;margin-bottom:.9rem;}
.successBox{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:.75rem 1rem;font-size:.79rem;color:#34d399;margin-bottom:.9rem;}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0;}
.av-b{background:rgba(59,130,246,.2);color:#60a5fa;}
.av-g{background:rgba(16,185,129,.2);color:#34d399;}
code{font-family:monospace;font-size:.82rem;}
pre{font-family:monospace;font-size:.75rem;background:rgba(0,0,0,.4);padding:.75rem;border-radius:8px;overflow-x:auto;white-space:pre-wrap;color:var(--text2);}
.tabs{display:flex;gap:.35rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;}
.tab{padding:.5rem .9rem;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab:hover{color:var(--text);}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-right:.4rem;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginPage">
  <div class="lpB">
    <div class="brandLogo">🧵</div>
    <div class="brandName">FabricFlow</div>
    <div class="brandTag">Manufacturing Supply Chain Intelligence Platform</div>

  </div>
  <div class="lpF">
    <div class="lpT">Welcome back</div>
    <div class="lpS">Sign in to your FabricFlow dashboard</div>
    <div class="fg"><label>Username</label><input id="li_u" placeholder="Enter username" autocomplete="username"/></div>
    <div class="fg"><label>Password</label><input id="li_p" type="password" placeholder="Enter password" autocomplete="current-password"/></div>
    <button class="btnLogin" onclick="doLogin()">Sign In →</button>
    <div class="lpErr" id="lpErr">Invalid credentials.</div>

  </div>
</div>

  s(k,v){localStorage.setItem('ff3_'+k,JSON.stringify(v));},
  o(k){try{return JSON.parse(localStorage.getItem('ff3_'+k))||null;}catch{return null;}},

};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

// ═══════════════════════════════════════════════════════
function pushNotif(toId, msg, type='order', meta={}){
  const notifs=DB.g('notifications');
  notifs.push({id:uid(),toId,msg,type,meta,read:false,createdAt:new Date().toISOString()});
  DB.s('notifications',notifs);
  updateBell();
}

function myNotifs(){
  const all=DB.g('notifications');
  if(!cu) return[];
  if(cu.role==='admin') return all.slice().reverse();             // admin sees ALL
  return all.filter(n=>n.toId===cu.id||n.toId==='all').reverse(); // others see their own
}

function unreadCount(){return myNotifs().filter(n=>!n.read).length;}

function updateBell(){
  const cnt=unreadCount();
  const bell=document.getElementById('bellCount');
  if(bell){
    if(cnt>0){bell.textContent=cnt>99?'99+':cnt;bell.style.display='flex';}
    else bell.style.display='none';
  }
  // also update nav badge
  const navB=document.getElementById('ni-notifs');
  if(navB){
    const badge=navB.querySelector('.niBadge');
    if(badge) badge.textContent=cnt||'';
    if(badge) badge.style.display=cnt?'flex':'none';
  }
}

function renderNotifFeed(){
  const ns=myNotifs();
  const feed=document.getElementById('notifFeed');
  if(!feed)return;
  if(!ns.length){feed.innerHTML=`<div class="empty"><div class="emptyIco">🔔</div><div class="emptyTxt">No notifications yet</div></div>`;return;}
  feed.innerHTML=ns.map(n=>`
    <div class="notifItem ${n.read?'':'unread'} ${n.type}" onclick="readNotif('${n.id}')">
      ${!n.read?`<div class="nUnreadDot"></div>`:''}
      <div class="nMsg"><span class="nIco">${NOTIF_ICONS[n.type]||'🔔'}</span>${n.msg}</div>
      <div class="nTime">${timeAgo(n.createdAt)}</div>
    </div>`).join('');
}

function readNotif(id){
  const ns=DB.g('notifications'),i=ns.findIndex(n=>n.id===id);
  if(i>-1)ns[i].read=true;
  DB.s('notifications',ns);
  renderNotifFeed();updateBell();
}
function markAllRead(){
  const ns=DB.g('notifications');
  if(cu.role==='admin') ns.forEach(n=>n.read=true);
  else ns.filter(n=>n.toId===cu.id||n.toId==='all').forEach(n=>n.read=true);
  DB.s('notifications',ns);
  renderNotifFeed();updateBell();
}
function clearNotifs(){
  if(cu.role==='admin') DB.s('notifications',[]);
  else{const ns=DB.g('notifications').filter(n=>n.toId!==cu.id&&n.toId!=='all');DB.s('notifications',ns);}
  renderNotifFeed();updateBell();
}
function openNotif(){document.getElementById('notifMask').classList.add('open');renderNotifFeed();}
function closeNotif(){document.getElementById('notifMask').classList.remove('open');}

async function saveMfr(){
  const n=v('m_n'),u=v('m_u'),p=v('m_p'),e=v('m_e');
  if(!n||!u||!p){toast('Name, username and password required','error');return;}
  const users=DB.g('users');if(users.find(x=>x.username===u)){toast('Username taken','error');return;}
  const id=uid();
  const btn = document.querySelector('.modal button.btn-p');
  if(btn) { btn.disabled = true; btn.innerHTML = 'Creating (Provisioning SNS)...'; }
  const topicArn = await createUserSns(id, 'mfr', e);

async function validateAws(){
  const key=v('aws_key'),secret=v('aws_secret'),token=v('aws_token'),region=document.getElementById('aws_region').value;
  if(!key||!secret){toast('Enter both Access Key and Secret Key','error');return;}
  const btn=document.getElementById('validateBtn');
  btn.innerHTML='<span class="spinner"></span>Validating…';btn.disabled=true;
  const res=document.getElementById('awsValResult');
  try{
    let headers = {'X-Aws-Key':key,'X-Aws-Secret':secret,'X-Aws-Region':region,'Accept':'application/json','Content-Type':'application/json'};
    if (token) headers['X-Aws-Token'] = token;
    const r=await fetch(API+'/aws/validate',{method:'POST',headers:headers,body:JSON.stringify({})});
    const d=await r.json();
    if(d.success){
      saveAwsCreds({key,secret,token,region,validated:true,accountId:d.data.account_id,topicArn:getAwsCreds().topicArn||''});
      res.innerHTML=`<div class="successBox">✅ Connected! Account: <strong>${d.data.account_id}</strong> · User: ${d.data.user_arn.split('/').pop()}</div>`;
      pushNotif('admin-001',`☁️ AWS account connected successfully (${d.data.account_id})`, 'aws',{fromId:cu.id});
      toast('AWS connected!','success');
      setTimeout(()=>navigate('aws-setup'),1000);
    }else{
      res.innerHTML=`<div class="lpErr" style="display:block">${d.error}</div>`;
    }
  }catch(e){
    res.innerHTML=`<div class="lpErr" style="display:block">Connection failed. Is the API running?</div>`;
  }
  btn.innerHTML='🔍 Test & Save';btn.disabled=false;
}

function acceptOrd(id){
  const orders=DB.g('orders'),i=orders.findIndex(o=>o.id===id);
  if(i<0)return;
  const ord=orders[i];
  orders[i]={...ord,status:'Processing',acceptedAt:new Date().toISOString()};
  DB.s('orders',orders);
  // Notify buyer
  pushNotif(ord.buyerId,`✅ Your order #${id.slice(-8).toUpperCase()} has been accepted by ${cu.name} — now in Processing stage`,'stage',{fromId:cu.id,orderId:id});
  const buyer=DB.g('users').find(x=>x.id===ord.buyerId);
  if(buyer && buyer.email) {
    sendEmail(buyer.email, 'Order Accepted & Processing', `
      <div style="font-family:sans-serif;color:#333;">
        <h3>Hello ${buyer.name},</h3>
        <p>Good news! Your order for <strong>${ord.fabricType}</strong> has been officially accepted by <strong>${cu.name}</strong>.</p>
        <p>It is now in the <strong>Processing</strong> stage. We will notify you of any further updates or delays.</p>
      </div>
    `);
  }
  // Notify admin
  pushNotif('admin-001',`🔄 Order #${id.slice(-8).toUpperCase()} accepted by ${cu.name} → Processing`,'stage',{fromId:cu.id,orderId:id});
  // SNS email if configured
  sendSnsNotification(`Order Accepted — FabricFlow`,`Order #${id.slice(-8).toUpperCase()} by ${cu.name} is now in Processing stage.\nBuyer has been notified.`);
  
  if(buyer) publishUserSns(buyer.id, 'Order Accepted', `Your order for ${ord.fabricType} has been accepted by ${cu.name} and is now Processing.`);
  publishUserSns(cu.id, 'Order Accepted', `You accepted the order #${id.slice(-8).toUpperCase()} from ${buyer?buyer.name:'the buyer'}.`);

  toast('Order accepted → Processing','success');
  buildNav();
  if(pg==='orders')renderOrders();else renderMfrDash();
}

  sendSnsNotification(`Order Update — FabricFlow`,`Order #${id.slice(-8).toUpperCase()} advanced to ${nextStage}.\nManufacturer: ${cu.name}`);

  const ord = (DB.g('orders')||[]).find(o=>o.id===id);
  if(!ord){ toast('Order not found','error'); return; }

  openModal('⚠️ Report Order Delay',

       <label style="font-weight:600;color:var(--text)">Order</label>
       <div style="font-size:.85rem;color:var(--text2);margin-bottom:.75rem">#${id.slice(-8).toUpperCase()} · ${ord.fabricType} · ${ord.qty} kg</div>
     </div>

     </div>`,
    `<button class="btn btn-d" onclick="closeModal()">Cancel</button>
     <button class="btn" style="background:var(--red);color:#fff" onclick="confirmDelay('${id}')">🚨 Report Delay</button>`

function confirmDelay(id){
  const reasonEl = document.getElementById('delayReason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if(!reason){ toast('Please enter a reason for the delay','error'); return; }

  const orders=DB.g('orders'), i=orders.findIndex(o=>o.id===id);
  if(i<0){ toast('Order not found','error'); return; }
  const ord=orders[i];

  orders[i]={...ord, delayReason: reason, isDelayed: true, updatedAt:new Date().toISOString()};
  DB.s('orders',orders);
  closeModal();

  pushNotif(ord.buyerId,`⚠️ Your order #${id.slice(-8).toUpperCase()} has been reported DELAYED. Reason: ${reason}`,'system',{fromId:cu.id,orderId:id});
  pushNotif('admin-001',`⚠️ Order #${id.slice(-8).toUpperCase()} delayed by ${cu.name}`,'system',{fromId:cu.id,orderId:id});

  const buyer=DB.g('users').find(x=>x.id===ord.buyerId);
  if(buyer){
    publishUserSns(buyer.id, 'Order Delayed', `Order #${id.slice(-8).toUpperCase()} is delayed. Reason: ${reason}`);
    if(buyer.email){
      sendEmail(buyer.email, `⚠️ Order Delayed — FabricFlow`, `
        <div style="font-family:sans-serif;color:#333;">
          <h3>Order Delay Notification</h3>
          <p>Hello ${buyer.name}, your order for <strong>${ord.fabricType}</strong> has been delayed.</p>
          <p><strong>Reason provided by Manufacturer:</strong> ${reason}</p>
          <p>Please log in to your dashboard to view the latest status.</p>
        </div>
      `);
    }
  }

  toast(`Delay reported — buyer has been notified`, 'info');
  updateBell();
  if(pg==='orders') renderOrders(); else if(pg==='shipments') renderShipments();
}

function stageDesc(s){return{Processing:'Raw materials being processed',Weaving:'Yarns being woven into fabric',Dyeing:'Fabric being dyed and finished',Warehouse:'Quality check & packaging',Shipped:'Dispatched to destination!'}[s]||s;}

async function sendSnsNotification(subject,msg){
  const c=getAwsCreds();
  if(!c.topicArn||!c.validated)return;
  try{
    await fetch(API+'/aws/sns/publish',{method:'POST',headers:awsHeaders(),body:JSON.stringify({topic_arn:c.topicArn,subject,message:msg})});
  }catch(e){}// Silent fail — SNS is best-effort
}

async function sendEmail(to, subject, htmlBody){
  if(!to) return;
  try{
    await fetch(API+'/email/send',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({to, subject, body:htmlBody})
    });
  }catch(e){} // Silent fail
}

async function createUserSns(id, role, email) {
    if (!email || !getAwsCreds().validated) {
        if(!getAwsCreds().validated) toast('AWS credentials not validated. SNS disabled.','error');
        return null;
    }
    try {
        const name = `fabricflow-${role}-${id}`;
        const r1 = await fetch(API+'/aws/sns/topics', { method:'POST', headers:awsHeaders(), body:JSON.stringify({name}) });
        const d1 = await r1.json();
        if (d1.success) {
            const topicArn = d1.data.topic_arn;
            const r2 = await fetch(API+'/aws/sns/subscribe', { method:'POST', headers:awsHeaders(), body:JSON.stringify({topic_arn: topicArn, email: email}) });
            const d2 = await r2.json();
            if(!d2.success) toast('SNS Subscribe failed: ' + d2.error, 'error');
            else toast(`AWS SNS confirmation email sent to ${email}!`,'success');
            return topicArn;
        } else {
            toast('SNS Topic creation failed: ' + d1.error, 'error');
        }
    } catch(e) {
        toast('SNS Provisioning error: ' + e.message, 'error');
    }
    return null;
}

async function publishUserSns(userId, subject, message) {
    const user = DB.g('users').find(u => u.id === userId);
    if (!user || !user.topicArn) return;
    try {
        await fetch(API+'/aws/sns/publish', { method:'POST', headers:awsHeaders(), body:JSON.stringify({topic_arn: user.topicArn, subject, message}) });
    } catch(e) {}
}

function placeOrder(){
  const mId=v('po_m'),fab=v('po_f')||'cotton',qty=v('po_q'),orig=v('po_o'),dest=v('po_d');
  if(!mId){toast('Select a manufacturer','error');return;}
  if(!qty||+qty<=0){toast('Enter valid quantity','error');return;}
  if(orig===dest){toast('Origin and destination cannot be the same','error');return;}
  const ord={id:uid(),buyerId:cu.id,manufacturerId:mId,fabricType:fab,qty:+qty,
    origin:orig,destination:dest,notes:v('po_n'),priority:v('po_pr'),
    requiredBy:v('po_dt'),status:'pending',createdAt:new Date().toISOString()};
  DB.g('orders').push(ord);
  DB.s('orders',[...DB.g('orders').filter(o=>o.id!==ord.id),ord]);
  // Notify manufacturer
  const mfr=DB.g('users').find(x=>x.id===mId);
  pushNotif(mId,`📦 New order from <strong>${cu.name}</strong> — ${fab} fabric · ${qty} kg · ${orig}→${dest}. <em>Tap to review.</em>`,'order',{fromId:cu.id,orderId:ord.id});
  // Notify admin
  pushNotif('admin-001',`📦 New order placed by ${cu.name} with ${mfr?mfr.name:'manufacturer'} — ${fab} · ${qty}kg`,'order',{fromId:cu.id,orderId:ord.id});
  // SNS
  sendSnsNotification(`New Order — FabricFlow`,`Buyer ${cu.name} placed a new order:\nFabric: ${fab}\nQty: ${qty}kg\nRoute: ${orig} → ${dest}\nManufacturer: ${mfr?mfr.name:'?'}`);
  // Email Manufacturer
  if(mfr && mfr.email) {
    sendEmail(mfr.email, 'New Fabric Order Received', `
      <div style="font-family:sans-serif;color:#333;">
        <h3>Hello ${mfr.name},</h3>
        <p>You received a new order from <strong>${cu.name}</strong>.</p>
        <p><strong>Fabric:</strong> ${fab}<br>
        <strong>Quantity:</strong> ${qty} kg<br>
        <strong>Route:</strong> ${orig} &rarr; ${dest}</p>
        <p>Please log in to your FabricFlow Manufacturer Dashboard to accept or reject this order.</p>
      </div>
    `);
  }
  // Email Buyer
  if(cu.email) {
    sendEmail(cu.email, 'Order Placed — FabricFlow', `
      <div style="font-family:sans-serif;color:#333;">
        <h3>Hello ${cu.name},</h3>
        <p>Your order for ${qty}kg of ${fab} has been successfully submitted to ${mfr?mfr.name:'the manufacturer'}.</p>
        <p>You will receive an email update once it is accepted and moves into Processing.</p>
      </div>
    `);
  }
  
  // Specific SNS pushes
  if(mfr) publishUserSns(mfr.id, 'New Order Received', `Buyer ${cu.name} placed a new order for ${qty}kg of ${fab}. Route: ${orig} -> ${dest}.`);
  publishUserSns(cu.id, 'Order Placed Successfully', `Your order for ${qty}kg of ${fab} was sent to ${mfr?mfr.name:'the manufacturer'}.`);

  toast('Order placed! Manufacturer has been notified.','success');
  updateBell();
  navigate('my-orders');
}

let activeChatUserId = null;
function renderChatPage(){
  setPage('Chat','Messages');
  const u=DB.g('users');
  const msgs=DB.g('chat_messages')||[];
  let contacts = [];
  if(cu.role==='buyer') contacts = u.filter(x=>x.role==='manufacturer');
  if(cu.role==='manufacturer') contacts = u.filter(x=>x.role==='buyer'&&x.manufacturerId===cu.id);
  
  if(!activeChatUserId && contacts.length>0) activeChatUserId = contacts[0].id;
  
  // Mark active chat messages as read
  if(activeChatUserId) {
      let updated = false;
      msgs.forEach(m => {
          if (m.toId === cu.id && m.fromId === activeChatUserId && !m.read) {
              m.read = true;
              updated = true;
          }
      });
      if(updated) {
          DB.s('chat_messages', msgs);
          buildNav(); // refresh global chat badge
      }
  }
  
  document.getElementById('cb').innerHTML=`
  <div style="display:flex;height:calc(100vh - 120px);gap:1rem;">
    <div style="width:250px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-y:auto;display:flex;flex-direction:column;">
      <div style="padding:1rem;font-weight:700;border-bottom:1px solid var(--border)">Contacts</div>
      ${contacts.length?contacts.map(c=>{
        const unreadCount = msgs.filter(m=>m.fromId===c.id&&m.toId===cu.id&&!m.read).length;
        const unreadBadge = unreadCount ? `<span class="niBadge blue" style="position:static;margin-left:auto">${unreadCount}</span>` : '';
        return `
        <div onclick="activeChatUserId='${c.id}';renderChatPage()" style="padding:1rem;cursor:pointer;border-bottom:1px solid var(--border);background:${activeChatUserId===c.id?'var(--card2)':'transparent'};display:flex;align-items:center;">
          <div>
              <div style="font-weight:600">${c.name}</div>
              <div style="font-size:0.75rem;color:var(--text3)">${c.role}</div>
          </div>
          ${unreadBadge}
        </div>`
      }).join(''):'<div style="padding:1rem;color:var(--text3)">No contacts found</div>'}
    </div>
    
    <div style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;">
      ${activeChatUserId?`
        <div style="padding:1rem;font-weight:700;border-bottom:1px solid var(--border)">
          Chat with ${u.find(x=>x.id===activeChatUserId)?.name||'Unknown'}
        </div>
        <div id="chatMessages" style="flex:1;padding:1rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem">
          ${renderChatMessages()}
        </div>
        <div style="padding:1rem;border-top:1px solid var(--border);display:flex;gap:0.5rem">
          <input id="chatInput" style="flex:1;padding:0.7rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendChatMsg()">
          <button class="btn btn-p" onclick="sendChatMsg()">Send</button>
        </div>
      `:`<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3)">Select a contact to chat</div>`}
    </div>
  </div>`;
  
  const cm = document.getElementById('chatMessages');
  if(cm) cm.scrollTop = cm.scrollHeight;
}

function renderChatMessages(){
  const msgs = DB.g('chat_messages')||[];
  const chatMsgs = msgs.filter(m=>(m.fromId===cu.id && m.toId===activeChatUserId)||(m.fromId===activeChatUserId && m.toId===cu.id));
  if(!chatMsgs.length) return `<div style="text-align:center;color:var(--text3);margin-top:2rem">No messages yet. Say hi!</div>`;
  
  return chatMsgs.map(m=>{
    const isMe = m.fromId===cu.id;
    return `
      <div style="align-self:${isMe?'flex-end':'flex-start'};background:${isMe?'var(--blue)':'var(--card2)'};color:${isMe?'#fff':'var(--text)'};padding:0.6rem 1rem;border-radius:12px;max-width:70%;box-shadow:0 2px 5px rgba(0,0,0,0.1)">
        <div style="font-size:0.9rem">${m.text}</div>
        <div style="font-size:0.65rem;text-align:right;opacity:0.7;margin-top:0.3rem">${new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `;
  }).join('');
}

function sendChatMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !activeChatUserId) return;
  
  const msgs = DB.g('chat_messages')||[];
  msgs.push({id:uid(), fromId:cu.id, toId:activeChatUserId, text, timestamp:new Date().toISOString()});
  DB.s('chat_messages',msgs);
  
  pushNotif(activeChatUserId, `💬 New message from ${cu.name}: "${text.substring(0,30)}${text.length>30?'...':''}"`, 'system', {fromId:cu.id});
  
  const target = DB.g('users').find(u=>u.id===activeChatUserId);
  if(target && target.email) {
      sendEmail(target.email, `New Chat Message from ${cu.name}`, `
        <div style="font-family:sans-serif;color:#333;">
          <p><strong>${cu.name}</strong> sent you a message:</p>
          <blockquote style="border-left:4px solid #007bff;padding-left:10px;color:#555;">${text}</blockquote>
          <p>Please log in to FabricFlow to reply.</p>
        </div>
      `);
  }
  
  renderChatPage();
}

function kpi(ico,lbl,val,bar){return `<div class="kc"><div class="kcBar" style="background:${bar}"></div><div class="kcIco">${ico}</div><div class="kcVal">${val}</div><div class="kcLbl">${lbl}</div></div>`;}
function miniStat(lbl,val,c){return `<div style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.4rem .75rem;display:flex;align-items:center;gap:.4rem"><div style="font-size:.9rem;font-weight:700;color:${c}">${val}</div><div style="font-size:.67rem;color:var(--text3)">${lbl}</div></div>`;}
function pipeSteps(perStage){return STAGES.map(n=>{const c=perStage[n]||0;return `<div class="ps ${c>0?'active':''}"><div class="sc">${SICONS[n]}</div><div class="sl" style="font-size:.65rem">${n}</div><div style="font-size:.72rem;font-weight:700;color:${c>0?'var(--blue)':'var(--text3)'}">${c}</div></div>`;}).join('');}
function awsChip(status,label,sub,ico){return `<div class="awsChip"><div class="awsDot ${status}"></div><div style="font-size:.95rem">${ico}</div><div><div class="awsLabel">${label}</div><div class="awsSub">${sub}</div></div></div>`;}
function empty(ico,txt){return `<div class="empty"><div class="emptyIco">${ico}</div><div class="emptyTxt">${txt}</div></div>`;}
function openModal(t,body,foot=''){document.getElementById('gMT').textContent=t;document.getElementById('gMB').innerHTML=body;document.getElementById('gMF').innerHTML=foot;document.getElementById('gModal').classList.add('open');}
function closeModal(){document.getElementById('gModal').classList.remove('open');}
document.getElementById('gModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function toast(msg,type='info'){
  const s=document.getElementById('ts');
  const icons={success:'✅',error:'❌',info:'ℹ️',warn:'⚠️'};
  const el=document.createElement('div');
  el.className=`ti ${type}`;el.innerHTML=`<span>${icons[type]}</span>${msg}`;
  s.appendChild(el);setTimeout(()=>el.classList.add('in'),10);
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),350);},4000);
}
async function apiFetch(path,opts={}){
  const r=await fetch('/int/v1'+path,{headers:{'Accept':'application/json','Content-Type':'application/json'},...opts});
  const d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d));return d;
}

function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function timeAgo(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
